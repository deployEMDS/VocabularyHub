on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build . --file Dockerfile --tag data_processing --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/data_processing
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest

          docker tag data_processing $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
